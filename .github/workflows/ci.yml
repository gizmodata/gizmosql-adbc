name: gizmosql-adbc-ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
  pull_request:
    branches: [main]
  workflow_dispatch:
  # Called by release.yml and go-module.yml as the pre-publish test gate.
  workflow_call:

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: gofmt
        working-directory: go
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        working-directory: go
        run: go vet ./...

      - name: Unit tests
        working-directory: go
        run: go test -short ./...

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Fetch GizmoSQL server binary
        run: |
          pip install gizmosql
          python - <<'EOF'
          from gizmosql._install import ensure_binary, server_release_tag
          from gizmosql._version import __version__
          path = ensure_binary(version=server_release_tag(__version__), channel="stable")
          print(f"server binary: {path}")
          EOF

      - name: Integration tests
        working-directory: go
        run: go test -v -run Integration ./...

      - name: Build shared library
        run: make -C go lib

      - name: C-ABI smoke test (Python driver manager)
        run: |
          pip install adbc-driver-manager pyarrow
          python python/smoke_test_dylib.py

      - name: Python bindings — verbatim 1.x test suite
        working-directory: python
        run: |
          pip install -e ".[test]"
          python -m pytest tests -v -q

  wheel-python-versions:
    # The py3-none-<platform> wheel is version-independent by design;
    # this job proves it on every supported CPython.
    name: wheel on python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build shared library and wheel
        run: |
          make -C go lib
          cp go/build/libadbc_driver_gizmosql.* python/src/adbc_driver_gizmosql/
          pipx run build --wheel python || (pip install build && cd python && python -m build --wheel)

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install wheel and run full test suite
        working-directory: python
        run: |
          python -m pip install dist/*.whl pytest "gizmosql>=1.32.0,<2" cryptography
          python -c "import adbc_driver_gizmosql as m, sys; print(sys.version, m.__version__)"
          python -m pytest tests -q

  lib-matrix:
    name: lib (${{ matrix.os }}${{ matrix.goarch != '' && format(' {0}', matrix.goarch) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: macos-latest
            goarch: amd64
          - os: windows-latest
          - os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - uses: mlugg/setup-zig@v2
        if: runner.os == 'Linux'
        with:
          version: 0.14.1

      - name: Install llvm-mingw (aarch64 C toolchain for cgo)
        if: matrix.os == 'windows-11-arm'
        shell: bash
        run: |
          # The runner's default gcc is x86_64 MinGW, whose assembler
          # cannot build the aarch64 cgo runtime. Use llvm-mingw's
          # native aarch64 UCRT toolchain instead.
          curl -sSL -o "$RUNNER_TEMP/llvm-mingw.zip" \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-aarch64.zip
          unzip -q "$RUNNER_TEMP/llvm-mingw.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/llvm-mingw-20260616-ucrt-aarch64/bin" >> "$GITHUB_PATH"
          echo "CC=aarch64-w64-mingw32-gcc" >> "$GITHUB_ENV"

      - name: Build shared library
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"  # explicit: defaults to 0 when GOARCH != host arch
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        shell: bash
        run: |
          scripts/build_lib.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build platform wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        shell: bash
        run: |
          # An empty _PYTHON_HOST_PLATFORM blanks the wheel platform tag,
          # so only export it on the macOS amd64 cross leg.
          if [ "${{ matrix.goarch }}" = "amd64" ] && [ "$RUNNER_OS" = "macOS" ]; then
            export _PYTHON_HOST_PLATFORM="macosx-11.0-x86_64"
          fi
          cp go/build/libadbc_driver_gizmosql.* python/src/adbc_driver_gizmosql/
          pip install build
          cd python && python -m build --wheel
          ls -la dist/

      - name: Repair wheel to manylinux
        if: runner.os == 'Linux'
        run: |
          pip install auditwheel patchelf
          auditwheel repair python/dist/*.whl -w python/dist-repaired
          rm python/dist/*.whl
          mv python/dist-repaired/*.whl python/dist/
          ls -la python/dist/

      - name: Check the glibc ceiling (2.17)
        if: runner.os == 'Linux'
        run: scripts/check_glibc.sh go/build/libadbc_driver_gizmosql.so python/dist/*.whl

      - uses: actions/upload-artifact@v7
        with:
          name: libadbc_driver_gizmosql-${{ matrix.os }}${{ matrix.goarch != '' && format('-{0}', matrix.goarch) || '' }}
          path: |
            go/build/libadbc_driver_gizmosql.*
            python/dist/*.whl

  oracle-linux-8:
    # The published Linux wheels must install and pass on a glibc-2.28 distro (Oracle Linux 8 /
    # RHEL 8), not only on the runner that built them: built with the runner's gcc they required
    # glibc 2.34 and could not be installed there at all.
    name: wheel on oracle linux 8 (${{ matrix.arch }})
    needs: lib-matrix
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            artifact: libadbc_driver_gizmosql-ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
            artifact: libadbc_driver_gizmosql-ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    container: oraclelinux:8
    steps:
      - name: Install Python 3.12 and git
        run: dnf install -y -q python3.12 python3.12-pip git tar

      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: ${{ matrix.artifact }}
          path: artifact

      - name: Install the wheel and run the Python test suite
        working-directory: python
        run: |
          ldd --version | head -1
          python3.12 -m venv /tmp/venv
          WHEEL=$(find ../artifact -name '*.whl' | head -1)
          echo "wheel: $WHEEL"
          /tmp/venv/bin/pip install -q "$WHEEL" pytest "gizmosql>=1.32.0,<2" cryptography
          /tmp/venv/bin/python -m pytest tests -q
