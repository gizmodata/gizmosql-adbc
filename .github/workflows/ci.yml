name: gizmosql-adbc-ci

on:
  push:
    branches: [main]
    paths-ignore:
      - "CHANGELOG.md"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  go:
    name: go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: gofmt
        working-directory: go
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: go vet
        working-directory: go
        run: go vet ./...

      - name: Unit tests
        working-directory: go
        run: go test -short ./...

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Fetch GizmoSQL server binary
        run: |
          pip install gizmosql
          python - <<'EOF'
          from gizmosql._install import ensure_binary, server_release_tag
          from gizmosql._version import __version__
          path = ensure_binary(version=server_release_tag(__version__), channel="stable")
          print(f"server binary: {path}")
          EOF

      - name: Integration tests
        working-directory: go
        run: go test -v -run Integration ./...

      - name: Build shared library
        run: make -C go lib

      - name: C-ABI smoke test (Python driver manager)
        run: |
          pip install adbc-driver-manager pyarrow
          python python/smoke_test_dylib.py

      - name: Python bindings — verbatim 1.x test suite
        working-directory: python
        run: |
          pip install -e ".[test]"
          python -m pytest tests -v -q

  wheel-python-versions:
    # The py3-none-<platform> wheel is version-independent by design;
    # this job proves it on every supported CPython.
    name: wheel on python ${{ matrix.python-version }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build shared library and wheel
        run: |
          make -C go lib
          cp go/build/libadbc_driver_gizmosql.* python/src/adbc_driver_gizmosql/
          pipx run build --wheel python || (pip install build && cd python && python -m build --wheel)

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install wheel and run full test suite
        working-directory: python
        run: |
          python -m pip install dist/*.whl pytest "gizmosql>=1.32.0,<2" cryptography
          python -c "import adbc_driver_gizmosql as m, sys; print(sys.version, m.__version__)"
          python -m pytest tests -q

  lib-matrix:
    name: lib (${{ matrix.os }}${{ matrix.goarch != '' && format(' {0}', matrix.goarch) || '' }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: ubuntu-24.04-arm
          - os: macos-latest
          - os: macos-latest
            goarch: amd64
          - os: windows-latest
          - os: windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Build shared library
        working-directory: go
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"  # explicit: defaults to 0 when GOARCH != host arch
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        shell: bash
        run: |
          case "$(go env GOOS)" in
            windows) EXT=dll ;;
            darwin)  EXT=dylib ;;
            *)       EXT=so ;;
          esac
          go build -tags driverlib -buildmode=c-shared \
            -o "build/libadbc_driver_gizmosql.$EXT" ./pkg/gizmosql
          ls -la build/

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build platform wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        shell: bash
        run: |
          # An empty _PYTHON_HOST_PLATFORM blanks the wheel platform tag,
          # so only export it on the macOS amd64 cross leg.
          if [ "${{ matrix.goarch }}" = "amd64" ] && [ "$RUNNER_OS" = "macOS" ]; then
            export _PYTHON_HOST_PLATFORM="macosx-11.0-x86_64"
          fi
          cp go/build/libadbc_driver_gizmosql.* python/src/adbc_driver_gizmosql/
          pip install build
          cd python && python -m build --wheel
          ls -la dist/

      - name: Repair wheel to manylinux
        if: runner.os == 'Linux'
        run: |
          pip install auditwheel patchelf
          auditwheel repair python/dist/*.whl -w python/dist-repaired
          rm python/dist/*.whl
          mv python/dist-repaired/*.whl python/dist/
          ls -la python/dist/

      - uses: actions/upload-artifact@v7
        with:
          name: libadbc_driver_gizmosql-${{ matrix.os }}${{ matrix.goarch != '' && format('-{0}', matrix.goarch) || '' }}
          path: |
            go/build/libadbc_driver_gizmosql.*
            python/dist/*.whl
