name: gizmosql-adbc-release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write # PyPI OIDC trusted publishing

jobs:
  build-libs:
    name: lib (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux_amd64
            ext: so
          - os: ubuntu-24.04-arm
            platform: linux_arm64
            ext: so
          - os: macos-latest
            platform: macos_arm64
            ext: dylib
          - os: macos-latest
            platform: macos_amd64
            ext: dylib
            goarch: amd64
          - os: windows-latest
            platform: windows_amd64
            ext: dll
          - os: windows-11-arm
            platform: windows_arm64
            ext: dll
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Install llvm-mingw (aarch64 C toolchain for cgo)
        if: matrix.os == 'windows-11-arm'
        shell: bash
        run: |
          # The runner's default gcc is x86_64 MinGW, whose assembler
          # cannot build the aarch64 cgo runtime. Use llvm-mingw's
          # native aarch64 UCRT toolchain instead.
          curl -sSL -o "$RUNNER_TEMP/llvm-mingw.zip" \
            https://github.com/mstorsjo/llvm-mingw/releases/download/20260616/llvm-mingw-20260616-ucrt-aarch64.zip
          unzip -q "$RUNNER_TEMP/llvm-mingw.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/llvm-mingw-20260616-ucrt-aarch64/bin" >> "$GITHUB_PATH"
          echo "CC=aarch64-w64-mingw32-gcc" >> "$GITHUB_ENV"

      - name: Build shared library
        working-directory: go
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"  # explicit: defaults to 0 when GOARCH != host arch
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        shell: bash
        run: |
          go build -tags driverlib -buildmode=c-shared \
            -o "build/libadbc_driver_gizmosql.${{ matrix.ext }}" ./pkg/gizmosql

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build platform wheel
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        shell: bash
        run: |
          # An empty _PYTHON_HOST_PLATFORM blanks the wheel platform tag,
          # so only export it on the macOS amd64 cross leg.
          if [ "${{ matrix.goarch }}" = "amd64" ] && [ "$RUNNER_OS" = "macOS" ]; then
            export _PYTHON_HOST_PLATFORM="macosx-11.0-x86_64"
          fi
          python3 scripts/sync_pypi_readme.py
          cp go/build/libadbc_driver_gizmosql.* python/src/adbc_driver_gizmosql/
          pip install build
          cd python && python -m build --wheel

      - name: Repair wheel to manylinux
        if: runner.os == 'Linux'
        run: |
          pip install auditwheel patchelf
          auditwheel repair python/dist/*.whl -w python/dist-repaired
          rm python/dist/*.whl
          mv python/dist-repaired/*.whl python/dist/

      - name: Package artifact
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          PKG="libadbc_driver_gizmosql-${VERSION}-${{ matrix.platform }}"
          mkdir -p "dist/$PKG"
          cp go/build/libadbc_driver_gizmosql.${{ matrix.ext }} "dist/$PKG/"
          cp packaging/gizmosql.toml.in LICENSE "dist/$PKG/"
          cd dist && tar czf "$PKG.tar.gz" "$PKG"
          cp ../python/dist/*.whl .

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.platform }}
          path: |
            dist/*.tar.gz
            dist/*.whl

  release:
    needs: build-libs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! [ -s release-notes.md ]; then
            echo "No CHANGELOG section found for $VERSION" > release-notes.md
          fi
          cat release-notes.md

      - uses: softprops/action-gh-release@v3
        with:
          body_path: release-notes.md
          files: |
            dist/*.tar.gz
            dist/*.whl

  pypi-publish:
    needs: build-libs
    runs-on: ubuntu-latest
    # Publish only on real version tags (not workflow_dispatch).
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Collect wheels
        run: |
          mkdir -p dist
          find artifacts -name "*.whl" -exec cp {} dist/ \;
          ls -la dist/
          test -n "$(ls dist/*.whl 2>/dev/null)"

      - name: Publish distribution to PyPI (OIDC trusted publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
