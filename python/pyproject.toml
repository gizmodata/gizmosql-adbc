[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
adbc_driver_gizmosql = ["libadbc_driver_gizmosql.*"]

[project]
name = "adbc-driver-gizmosql"
version = "2.0.17"
description = "Python ADBC driver for GizmoSQL (native Go driver core) with OAuth/SSO support"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [
    { name = "GizmoData", email = "support@gizmodata.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
]
dependencies = [
    # 1.13.0 (latest) requires Python 3.11; 3.10 stays on the 1.12 line so
    # a patch release does not drop a supported Python.
    "adbc-driver-manager>=1.13.0; python_version >= '3.11'",
    "adbc-driver-manager>=1.12.0; python_version < '3.11'",
    # Deliberately permissive: the bindings only touch pyarrow through
    # adbc-driver-manager's dbapi. A >=25 floor conflicted with
    # downstream consumers (e.g. xorq pins pyarrow<22) even though the
    # driver works fine there at runtime.
    "pyarrow>=14.0.0",
]

[project.urls]
Homepage = "https://github.com/gizmodata/gizmosql-adbc"
Repository = "https://github.com/gizmodata/gizmosql-adbc"
Issues = "https://github.com/gizmodata/gizmosql-adbc/issues"

[project.optional-dependencies]
test = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "gizmosql>=1.42.2,<2",
    "cryptography>=50.0.2",
]
dev = [
    "ruff>=0.17.4",
    "build>=1.6.1",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require a running GizmoSQL server (deselect with '-m \"not integration\"')",
]
